name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bondok_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate
      - name: TypeScript check (backend)
        working-directory: backend
        run: npx tsc --noEmit
      - name: Run backend tests
        working-directory: backend
        run: npm test
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/bondok_test"
          REDIS_URL: "redis://localhost:6379"
          JWT_ACCESS_SECRET: "ci_test_access_secret_16chars"
          JWT_REFRESH_SECRET: "ci_test_refresh_secret_16chars"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: TypeScript check (frontend)
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build frontend
        working-directory: frontend
        run: npm run build
  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -t bondok-backend ./backend
      - name: Build frontend Docker image
        run: docker build -t bondok-frontend ./frontend
